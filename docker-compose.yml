services:
  publisher:
    build:
      context: .
    container_name: media-auto-publisher
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MAPUB_DATA_DIR: /data
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data:/data
      - ./data/social-accounts:/app/third_party/social-auto-upload/cookies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
